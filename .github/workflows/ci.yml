name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # gawk runs the scripts which generate unit_tests.c; libomp is needed by
      # clang for -fopenmp
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gawk libomp-dev

      - name: Build unit_tests
        working-directory: check
        run: make CC=${{ matrix.cc }}

      # unit_tests exits with a non-zero status if any test failed
      - name: Run unit_tests
        working-directory: check
        run: ./unit_tests
