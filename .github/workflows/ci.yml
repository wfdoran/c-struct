name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # gawk runs the scripts which generate unit_tests.c; libomp is needed by
      # clang for -fopenmp
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gawk libomp-dev

      - name: Build unit_tests
        working-directory: check
        run: make CC=${{ matrix.cc }} WERROR=-Werror

      # unit_tests exits with a non-zero status if any test failed
      - name: Run unit_tests
        working-directory: check
        run: ./unit_tests

      # the examples in doc/*.md and README.md must compile
      - name: Check the documentation examples
        working-directory: check
        run: make doc-check CC=${{ matrix.cc }}

  # AddressSanitizer and UBSan; the other sanitizer targets are not run (see
  # the comment on test-tsan in check/makefile)
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gawk

      - name: Unit tests under AddressSanitizer and UBSan
        working-directory: check
        run: make test-asan WERROR=-Werror

  # The image is pinned: the formatting depends on the clang-format version, and
  # a newer image has a newer one.
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check that the headers are formatted
        working-directory: include
        run: make check-format
